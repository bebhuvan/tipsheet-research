[project]
name = "tipsheet-research"
version = "0.1.0"
description = "The tipsheet research desk: rigorous finance research for general readers"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16",
  "duckdb>=1.0",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
desk = "desk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
